ktor {
    deployment {
        port = 8080
        host = "0.0.0.0"
    }
    application {
        modules = [ org.scent.project.ApplicationKt.module ]
    }
}

jwt {
    secret = ${?JWT_SECRET}
    issuer = "fragrances-app"
    issuer = ${?JWT_ISSUER}
    audience = "fragrances-users"
    audience = ${?JWT_AUDIENCE}
    realm = "fragrances"
    realm = ${?JWT_REALM}
}

database {
    url = ${?DATABASE_URL}
    user = ${?DATABASE_USER}
    password = ${?DATABASE_PASSWORD}
}

scent {
    mode = ${?SCENT_ENV}
    devRoutes = ${?DEV_ROUTES}
    streamProvider = ${?STREAM_PROVIDER}
    imageProvider = ${?IMAGE_PROVIDER}
}

cloudflare {
    accountId = ${?CLOUDFLARE_ACCOUNT_ID}
    apiToken = ${?CLOUDFLARE_API_TOKEN}
    webhookSecret = ${?CLOUDFLARE_WEBHOOK_SECRET}
}

supabase {
    url = ${?SUPABASE_URL}
    serviceRoleKey = ${?SUPABASE_SERVICE_ROLE_KEY}
    bucket = ${?SUPABASE_STORAGE_BUCKET}
}
