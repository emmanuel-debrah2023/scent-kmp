appId: org.scent.project
onFlowStart:
  - runScript: ../scripts/seed-e2e-session.js
  - runScript: ../scripts/new-registration.js
tags:
  - suite
---
# The one black-box journey (ADR-0002): register a fresh account, prove the session survives a
# relaunch, log out, prove that survives a relaunch too, then log in with the seeded account.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Welcome back"
    timeout: 15000

# Register a fresh account.
- tapOn: "Register"
# "Display name" only appears on the register screen. (Selectors are full-match regexes, so
# "Already have an account? " with its "?" and trailing space can't be used as one.)
- extendedWaitUntil:
    visible: "Display name"
    timeout: 15000
- assertNotVisible: "Welcome back"
# Each input is reached by its own label; the keyboard is hidden before the next one so it
# can't cover the lower fields. Compose exposes a text field's label as a child node of the
# field, so focus is asserted on the field that contains the label rather than on the label.
- tapOn: "Username"
- assertVisible:
    containsChild: "Username"
    focused: true
- inputText: ${output.regUsername}
- assertVisible: ${output.regUsername}
- hideKeyboard
- tapOn: "Display name"
- assertVisible:
    containsChild: "Display name"
    focused: true
- inputText: ${output.regDisplayName}
- assertVisible: ${output.regDisplayName}
- hideKeyboard
- tapOn: "Email address"
- assertVisible:
    containsChild: "Email address"
    focused: true
- inputText: ${output.regEmail}
- assertVisible: ${output.regEmail}
- hideKeyboard
- tapOn: "Password"
- assertVisible:
    containsChild: "Password"
    focused: true
- inputText: ${output.regPassword}
# Exact match: fails if any of the password leaked into the email field.
- assertVisible: ${output.regEmail}
- hideKeyboard
# "Create account" is both the heading and the button; the button is the one below "Password".
- tapOn:
    text: "Create account"
    below: "Password"
- extendedWaitUntil:
    notVisible: "Display name"
    timeout: 15000
- assertNotVisible: "Display name"
- assertVisible: "Home"

# The session survives a relaunch (token persisted in DataStore).
- launchApp
- extendedWaitUntil:
    visible: "Home"
    timeout: 15000
- assertNotVisible: "Welcome back"

# Log out, and stay logged out across a relaunch.
- tapOn: "Profile"
- extendedWaitUntil:
    visible: "Settings"
    timeout: 15000
- tapOn: "Settings"
- assertVisible: "Log out"
- tapOn: "Log out"
- assertVisible: "Log out of scent?"
- tapOn: "LOG OUT"
- extendedWaitUntil:
    visible: "Welcome back"
    timeout: 15000
- assertNotVisible: "Log out of scent?"
- launchApp
- extendedWaitUntil:
    visible: "Welcome back"
    timeout: 15000
- assertNotVisible: "Home"

# Log in with the seeded account.
- runFlow:
    file: ../subflows/log-in-through-ui.yaml
    env:
      LOGIN_EMAIL: ${output.e2eEmail}
      LOGIN_PASSWORD: ${output.e2ePassword}
- assertVisible: "Home"
