appId: org.scent.project
tags:
  - suite
---
# Proves a signed-in user sees the seeded Community posts and can scroll the feed to more of them.
# Every seeded post carries the same four hashtags, so assertions hold however many seed runs there have been.
# The server returns them in no fixed order (TODO(fix/post-hashtag-order)), so match one tag, not the whole line.
- runFlow: ../subflows/start-authenticated.yaml

- tapOn: "Community"
- extendedWaitUntil:
    visible: "Latest posts"
    timeout: 15000
- assertNotVisible: "FEATURED TODAY"
- assertVisible: "Latest posts"
- assertVisible: ".*#scentoftheday.*"

- swipe:
    direction: UP
- extendedWaitUntil:
    notVisible: "Latest posts"
    timeout: 15000
- assertNotVisible: "Latest posts"
- assertVisible: ".*#scentoftheday.*"
