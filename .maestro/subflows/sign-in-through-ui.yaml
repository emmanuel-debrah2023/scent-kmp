appId: org.scent.project
onFlowStart:
  - runScript: ../scripts/seed-e2e-session.js
tags:
  - suite
---
# Fallback start for platforms without the launch-argument hook (iOS today): seed the account
# through the API, then sign in through the real login screen. Prefer start-authenticated.yaml.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Welcome back"
    timeout: 15000
- runFlow:
    file: log-in-through-ui.yaml
    env:
      LOGIN_EMAIL: ${output.e2eEmail}
      LOGIN_PASSWORD: ${output.e2ePassword}
- assertVisible: "Home"
