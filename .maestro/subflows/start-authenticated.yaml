appId: org.scent.project
onFlowStart:
  - runScript: ../scripts/seed-e2e-session.js
tags:
  - suite
---
# Gray-box start (ADR-0002): seed the account through the API, hand the app a real JWT as a
# launch argument, and let it hydrate the session exactly as on a relaunch.
# Pass E2E_ROUTE (e.g. marketplace, profile/create-listing) through runFlow env to open on that
# screen; the caller asserts the screen itself. "Home" below is the bottom-nav label, shown on every tab.
# Android only; use sign-in-through-ui.yaml where the launch-argument hook doesn't exist (iOS).
# Requires the backend on localhost:8080 with dev routes mounted (-DSTREAM_PROVIDER=fake).
- launchApp:
    clearState: true
    arguments:
      e2eToken: ${output.e2eToken}
      e2eRoute: ${output.e2eRoute}
- extendedWaitUntil:
    visible: "Home"
    timeout: 15000
- assertNotVisible: "Welcome back"
- assertVisible: "Home"
