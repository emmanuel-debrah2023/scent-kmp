appId: org.scent.project
---
# Signs in through the real login screen. Expects to start on it.
# Pass the account with env: LOGIN_EMAIL and LOGIN_PASSWORD.
- extendedWaitUntil:
    visible: "Welcome back"
    timeout: 15000
# Compose exposes a text field's label as a child node of the field, so focus is asserted on
# the field that contains the label rather than on the label itself.
- tapOn: "Email address"
- assertVisible:
    containsChild: "Email address"
    focused: true
- inputText: ${LOGIN_EMAIL}
- assertVisible: ${LOGIN_EMAIL}
- hideKeyboard
- tapOn: "Password"
- assertVisible:
    containsChild: "Password"
    focused: true
- inputText: ${LOGIN_PASSWORD}
# Exact match: fails if any of the password leaked into the email field.
- assertVisible: ${LOGIN_EMAIL}
- tapOn: "Sign in"
- extendedWaitUntil:
    notVisible: "Welcome back"
    timeout: 15000
- assertNotVisible: "Welcome back"
- assertVisible: "Home"
