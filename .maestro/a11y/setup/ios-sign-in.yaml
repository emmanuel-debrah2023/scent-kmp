appId: ${APP_ID}
onFlowStart:
  - runScript: ../../scripts/seed-e2e-session.js
---
# iOS only: signs in once through the real login screen, before scripts/pre-merge-check.sh turns on
# large Dynamic Type. The per-screen a11y flows then relaunch into this stored session.
# Not run at large text because at accessibility-large the keyboard covers SIGN IN and nothing
# dismisses it (no tap-outside, no scroll, return key does not close it): a real app gap,
# TODO(fix/auth-forms-and-viewmodel). Once fixed, sign in at large text and drop the size switch.
# Not log-in-through-ui.yaml: on iOS the label sits on the field itself rather than on a child
# node, so its containsChild/focused checks can't match. The typed text is asserted instead.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Welcome back"
    timeout: 15000
- tapOn: "Email address"
- assertVisible: "Email address"
- inputText: ${output.e2eEmail}
- assertVisible: ${output.e2eEmail}
- tapOn: "Password"
- assertVisible: "Password"
- inputText: ${output.e2ePassword}
- assertVisible: ${output.e2eEmail}
- tapOn: "SIGN IN"
- extendedWaitUntil:
    notVisible: "Welcome back"
    timeout: 15000
- assertNotVisible: "Welcome back"
- assertVisible: "Home"
